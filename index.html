<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- favicon vacio -->
    <link rel="icon" href="./assets/obersat-favicon-1-192x192.png" />
    <!-- css custom -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- iconos -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <title>OberSat - Sonidos de notificacion</title>
  </head>
  <body>
    <header class="encabezado">
      <div class="encabezado-logo">
        <img
          src="./assets/logo-obersat.png"
          alt="logo obersat"
          width="110px"
          height="30px"
        />
        <p>
          Rastreo satelital GPS para tu flota.
          <a class="cta" href="https://obersat.com" target="_blank"
            >Nuestros servicios.</a
          >
        </p>
      </div>
      <div class="encabezado-titulo">
        <h1>Sonidos de notificación</h1>
        <p>
          Elegi un sonido, escúchalo, y copia su link para usarlo con
          notificaciones.
        </p>
      </div>
    </header>

    <!-- aqui cargan cards con sonidos -->
    <main class="grid" id="grid-sonidos"></main>

    <!-- notificacion toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- javascript custom -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
